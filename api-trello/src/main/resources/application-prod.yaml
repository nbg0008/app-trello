spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:${MYSQL_URL}
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health, info
        exclude: env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
app:
  base-url: http://${RAILWAY_PUBLIC_DOMAIN}:8080/trello/v1/
  domain:
    success-url: http://${WEB_TRELLO_URL}/suscripcion/exito
    cancel-url: http://${WEB_TRELLO_URL}/suscripcion/fallo